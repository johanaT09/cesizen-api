name: CI/CD

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, zip, xml, exif, pcntl, curl, gd

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier le style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Auditer les dépendances PHP
        run: composer audit

      - name: Vérifier le Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Copier le fichier d'environnement de test
        run: cp .env.example .env

      - name: Générer la clé d'application
        run: php artisan key:generate

      - name: Lancer les tests
        run: php artisan test

      - name: Construire l'image Docker
        run: docker build -t cesizen-api .

      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cesizen-api
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/johanat09/cesizen-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/cesizen
            docker compose -f docker-compose.prod.yml --env-file .env pull app
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps app
            docker compose -f docker-compose.prod.yml --env-file .env exec -T app php artisan migrate --force